<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生日快乐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#ff9a9e,#fad0c4,#f6d365);
font-family:"Microsoft Yahei",sans-serif;
overflow:hidden;
}
.box{
text-align:center;
background:rgba(255,255,255,0.25);
backdrop-filter:blur(8px);
padding:60px 40px;
border-radius:24px;
box-shadow:0 8px 32px rgba(0,0,0,0.1);
}
h1{
font-size:46px;
color:#d6285c;
margin-bottom:20px;
}
.text{
font-size:20px;
color:#333;
line-height:2;
margin-bottom:35px;
}
.enter-btn{
cursor:pointer;
font-size:22px;
color:#d6285c;
border:2px solid #d6285c;
padding:12px 30px;
border-radius:50px;
background:rgba(255,255,255,0.35);
transition:0.3s;
display:inline-block;
}
.enter-btn:hover{
background:#d6285c;
color:#fff;
}
.confetti{
position:fixed;
width:10px;
height:10px;
opacity:0.8;
}
.pop-box{
position:fixed;
padding:16px 22px;
background:#fff;
border-radius:12px;
box-shadow:0 4px 16px rgba(0,0,0,0.15);
font-size:16px;
color:#333;
z-index:999;
}
</style>
</head>
<body>
<div class="box">
<h1>🎂 生日快乐！</h1>
<div class="text">
愿你平安喜乐，万事顺意<br>
岁岁无忧，所愿皆所得<br>
新的一岁闪闪发光✨
</div>
<div class="enter-btn" id="enter">点击进入>></div>
</div>
<script>
const colors=['#ff4d6d','#ffd166','#06d6a0','#118ab2','#ef476f'];
function createConfetti(){
let div=document.createElement('div');
div.classList.add('confetti');
div.style.left=Math.random()*100+'vw';
div.style.backgroundColor=colors[Math.floor(Math.random()*colors.length)];
document.body.appendChild(div);
let top=-15;
let speed=Math.random()*2+1;
function fall(){
top+=speed;
div.style.top=top+'px';
if(top<window.innerHeight){
requestAnimationFrame(fall);
}else{div.remove();}
}
fall();
}
setInterval(createConfetti,80);

const wishes = [
"🎂生日快乐！新一岁一切顺遂",
"✨岁岁常欢愉，年年皆胜意",
"💖平安健康，好运常在",
"🌟所有愿望，全部实现",
"🥳日子滚烫，快乐漫长",
"🎈前路光明，万事可期",
"🍀所得皆所愿，所行化坦途",
"💐永远热烈，永远开心",
"🎊新岁启程，万丈光芒",
"💌无忧无虑，岁岁年年",
"🌈好运爆棚，事事圆满",
"🎁平安喜乐，岁岁安康",
"🌷眼里有光，心中有爱",
"💫不负时光，不负自己",
"🎀日日开心，夜夜好梦",
"🌿前程似锦，未来可期",
"🍃一生被爱，温柔可爱",
"☀️向阳而生，步步生花",
"🎉万事胜意，岁岁欢喜",
"💎岁岁平安，年年有余"
];

document.getElementById("enter").addEventListener("click",()=>{
    for(let n=0;n<2;n++){
        wishes.forEach((text,index)=>{
            setTimeout(()=>{
                const pop = document.createElement("div");
                pop.className = "pop-box";
                pop.innerText = text;
                pop.style.left = Math.random() * (window.innerWidth - 240) + "px";
                pop.style.top = Math.random() * (window.innerHeight - 120) + "px";
                document.body.appendChild(pop);
                pop.onclick = ()=>pop.remove();
            }, index * 60);
        })
    }
})
</script>
</body>
</html>
